# Pier — a dock for your services.
#
#   Start:  docker compose up -d        → dashboard at http://localhost:3000
#   Update: docker compose pull && docker compose up -d
#
# All data (SQLite database, agent keys, uploaded icons) lives in ./data
# next to this file — back that folder up and Pier survives anything.
#
# The image is pulled prebuilt from GHCR (linux/amd64) — nothing is compiled
# on your device. To build from source instead, replace `image:` with
# `build: .` and run `docker compose up -d --build`.
services:
  pier:
    image: ghcr.io/butageek/pier:latest
    container_name: pier
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    # Out of the box Pier runs as the container's unprivileged `node` user
    # (uid 100) and fixes ./data ownership on startup — nothing to configure.
    #
    # Want ./data owned by YOUR account on the host (handy on a NAS/Synology,
    # so you can browse, edit and back up the files directly)? Find your ids
    # with `id -u` and `id -g`, then uncomment and fill them in:
    #environment:
    #  PUID: "1026"   # <- your user id    (default: 100)
    #  PGID: "100"    # <- your group id   (default: 100)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: let Pier also watch the Docker server it runs on. For other
  # servers, run pier-agent there instead (see README) — point Pier's
  # Add -> Device dialog at http://<that-host>:8080 with the same PIER_KEY.
  # pier-agent:
  #   image: ghcr.io/butageek/pier-agent:latest
  #   container_name: pier-agent
  #   environment:
  #     PIER_KEY: change-me
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   restart: unless-stopped
