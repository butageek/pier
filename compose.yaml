# Pier — the dashboard itself. Data (SQLite, agent keys) lives in ./data.
# The image is pulled prebuilt from GHCR — nothing is compiled on your device.
# To build from source instead, replace the image line below with:
#   build: .
# The container starts as root only to fix ./data ownership (Docker creates
# bind mounts as root), then runs the app as the unprivileged node user.
# Optional: PUID/PGID env vars run it as your host user instead, so ./data
# files are owned by you on the host. A named volume works too:
#   volumes: ["pier-data:/app/data"] + top-level `volumes: { pier-data: {} }`.
services:
  pier:
    image: ghcr.io/butageek/pier:latest
    container_name: pier
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: discover the Docker server Pier itself runs on. For other
  # servers, run pier-agent there instead (see README) — point Pier at
  # http://<that-host>:8080 and reuse PIER_KEY below.
  # pier-agent:
  #   image: ghcr.io/butageek/pier-agent:latest
  #   container_name: pier-agent
  #   environment:
  #     PIER_KEY: change-me
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   restart: unless-stopped
